<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="loginPage">
        <div class="card">
            <h2>Login</h2>
            <input type="email" id="email" placeholder="Enter Email" required>
            <input type="password" id="pwd" placeholder="Enter Password" required>
            <button onclick="login()">Login</button>
            <p id="errormsg" style="color: red;"></p>
        </div>
    </div>

    <div id="moviePage">
        <h1 style="text-align: center;">Movie Search</h1>
        <div style="text-align: center; margin-bottom: 20px;">
            <input type="text" id="searchInput" placeholder="Enter movie name">
            <button onclick="MovieSearch()">Search</button>
        </div>
        <ul id="movieList">Movies Here....</ul>
    </div>

    <script>
        const apiKey = "4d3ab9e2";

        async function login() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("pwd").value.trim();
            const errormsg = document.getElementById("errormsg");

            try{

                const res = await fetch("users.json");        //fetching data from users.json and store it in res
                const users = await res.json();               //Converting list into json format

                const user = users.find(u => u.email === email && u.password === password);  //validation

                if(user){
                    document.getElementById("loginPage").style.display = "none";
                    document.getElementById("moviePage").style.display = "block";
                } else {
                    errormsg.textContent = "Invalid email or password";
                }
            } catch(err){
                console.log("Error loading users.json:", err);
            }
        }

        async function MovieSearch() {
            const searchTerm = document.getElementById("searchInput").value.trim();
      const apiUrl = `https://www.omdbapi.com/?apikey=${apiKey}&s=${searchTerm}`;

      try {
        const response = await fetch(apiUrl);
        const data = await response.json();

        const movieList = document.getElementById("movieList");
        movieList.innerHTML = "";

        if (data.Response === "True") {
          data.Search.forEach(movie => {
            const li = document.createElement("li");
            li.classList.add("movie-card");

            li.innerHTML = `
              <img src="${movie.Poster !== "N/A" ? movie.Poster : 'https://via.placeholder.com/200x300?text=No+Image'}" alt="${movie.Title}">
              <h3 style="color:red;">${movie.Title}</h3>
              <p><i>Year: ${movie.Year} </i></p>
            `;
            movieList.appendChild(li);
          });
        } else {
          movieList.innerHTML = `<li>No movies found for "${searchTerm}"</li>`;
        }
      } catch (error) {
        console.error("Error fetching movies:", error);
      }
        }
    </script>
</body>
</html>
